name: Deploy

on:
  # CI 워크플로우가 성공적으로 완료된 후에만 실행한다.
  # push 트리거를 함께 두면 CI 결과를 기다리지 않는 배포가 한 번 더 돈다.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  deployments: write
  pull-requests: write
  statuses: write

jobs:
  deploy:
    name: Deploy to Vercel
    # CI 워크플로우가 성공한 경우에만 실행
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v41.1.4
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          # 액션 태그(v41.1.4)에 묶인 CLI 대신 최신 CLI를 사용한다.
          # Vercel 배포 엔드포인트가 47.2.2 이상을 요구해 41.1.4 는 실패한다.
          vercel-version: 59.10.0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-comment: false
